<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Offline - Lumina Bíblia</title>
<meta name="theme-color" content="#090d16">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; min-height: 100dvh;
        display: flex; align-items: center; justify-content: center; padding: 24px;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: radial-gradient(120% 90% at 50% 0%, #131b2e 0%, #090d16 60%);
        color: #f1f5f9; text-align: center;
    }
    .card { max-width: 420px; }
    .glyph {
        width: 78px; height: 78px; margin: 0 auto 22px; border-radius: 22px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #fbbf24, #ca8a04); color: #090d16; font-size: 34px;
        box-shadow: 0 18px 40px rgba(234,179,8,.25);
    }
    h1 { font-size: 22px; margin: 0 0 10px; color: #facc15; letter-spacing: .01em; }
    p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin: 0 0 26px; }
    blockquote { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 19px; color: #cbd5e1; margin: 26px 0 8px; line-height: 1.5; }
    cite { font-size: 12px; color: #64748b; font-style: normal; }
    button {
        appearance: none; border: 1px solid rgba(250,204,21,.35); background: rgba(250,204,21,.12);
        color: #facc15; font-weight: 700; font-size: 14px; padding: 12px 22px; border-radius: 14px; cursor: pointer;
    }
    button:active { transform: scale(.97); }
</style>
</head>
<body>
<div class="card">
    <div class="glyph">📖</div>
    <h1>Você está sem conexão</h1>
    <p>As páginas que você já leu continuam disponíveis no aparelho. Assim que a internet voltar, todo o resto volta junto.</p>
    <blockquote>&ldquo;Ainda que a figueira não floresça&hellip; todavia eu me alegrarei no Senhor.&rdquo;</blockquote>
    <cite>Habacuque 3.17-18</cite>
    <p style="margin-top:28px"><button onclick="location.reload()">Tentar novamente</button></p>
</div>
</body>
</html>
